# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  # Session 62 (2026-07-07): cosmetic info-level lints silenced so build output
  # stays focused on real regressions. If you want a full stylistic audit,
  # comment this block back in for one run.
  #
  # The lints below fire on 190+ locations across the pre-existing codebase.
  # None of them are runtime bugs — they're either:
  #   • purely stylistic (use_super_parameters, unnecessary_const, prefer_*)
  #   • deprecated-API warnings for methods that still work (Color.withOpacity,
  #     WillPopScope, Switch.activeColor, RadioListTile.groupValue/onChanged)
  #   • doc-comment formatting nits
  # Cleaning them touches 100+ files without user-visible impact.
  #
  # WARNINGS (unused_import, unused_field, unused_local_variable, unused_element,
  # dead_null_aware_expression, unnecessary_non_null_assertion,
  # unnecessary_cast) intentionally stay visible — they catch real bugs.
  rules:
    # -------- Style-only lints (silenced) --------
    use_super_parameters: false
    unnecessary_const: false
    unnecessary_brace_in_string_interps: false
    unnecessary_to_list_in_spreads: false
    prefer_is_empty: false
    prefer_collection_literals: false
    prefer_final_fields: false
    avoid_types_as_parameter_names: false
    non_constant_identifier_names: false
    no_leading_underscores_for_local_identifiers: false

    # -------- Doc-comment nits (silenced) --------
    unintended_html_in_doc_comment: false
    dangling_library_doc_comments: false

    # -------- Async-flow (silenced; codebase already has many that
    #                     aren't causing real issues) --------
    use_build_context_synchronously: false

analyzer:
  errors:
    # Deprecated-API warnings for APIs that still work in current Flutter.
    # Flutter deprecates on a fast schedule; suppressing here so we don't get
    # 50+ warnings every build. Real breakage would surface as an error, not
    # a deprecation notice.
    deprecated_member_use: ignore

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
