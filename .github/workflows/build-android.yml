name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Free up ~25 GB of pre-installed software we don't need
      # (dotnet, haskell, agents, swap). Without this the runner can hit
      # disk exhaustion when extracting the 945 MB PAD asset tarball +
      # Gradle build outputs + Android SDK + Flutter cache, which causes
      # the kernel OOM killer to nuke Gradle with SIGTERM (exit 143)
      # even though heap memory is fine.
      - name: Free disk space on runner
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/Java_Adopt_jdk \
                      /opt/hostedtoolcache/PyPy \
                      /usr/local/lib/android/sdk/ndk \
                      /usr/share/dotnet \
                      /usr/local/.ghcup \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /opt/microsoft \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      # === DOWNLOAD PAD ASSETS FROM GITHUB RELEASE ===
      # The 945 MB audio + image tree is gitignored (regenerated locally
      # via scripts/build_and_run.sh). For CI, the tree is published once
      # via scripts/pack_and_upload_assets.sh as a release asset on the
      # 'pad-assets' release. This step pulls + extracts it into the PAD
      # install-time module so the resulting AAB ships with full content.
      #
      # Falls back to placeholder dirs if the release asset is missing —
      # that only matters for dev pushes; tag builds will fail loudly if
      # the asset tarball isn't present.
      - name: Download PAD asset bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p android/install_time_assets/src/main/assets
          if gh release view pad-assets >/dev/null 2>&1; then
            echo "Downloading pad-assets.tar.gz from release pad-assets ..."
            gh release download pad-assets \
              --pattern 'pad-assets.tar.gz' \
              --output pad-assets.tar.gz
            ls -lh pad-assets.tar.gz
            echo "Extracting into install_time_assets/src/main/assets/ ..."
            tar -xzf pad-assets.tar.gz -C android/install_time_assets/src/main/assets
            rm pad-assets.tar.gz
            echo "Asset tree size after extract:"
            du -sh android/install_time_assets/src/main/assets
          else
            echo "::warning::pad-assets release not found — building with placeholder assets."
            mkdir -p android/install_time_assets/src/main/assets/audio
            mkdir -p android/install_time_assets/src/main/assets/images/vocabulary
            find android/install_time_assets -type d -empty -exec touch {}/.gitkeep \;
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "::error::Tag build cannot ship without assets. Run scripts/pack_and_upload_assets.sh from your dev machine first."
              exit 1
            fi
          fi

      # The one check that would have caught v1.24.0+143 shipping a
      # 958 MB AAB built from a three-month-old asset tarball. Tested
      # both ways before it landed: passes on a current tree, fails on
      # a PNG-era one with missing kid recordings.
      - name: Verify asset bundle is current
        run: python3 scripts/verify_asset_bundle.py android/install_time_assets/src/main/assets

      - name: Setup signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets not configured. APK will use debug signing."
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/awing-release-key.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=${{ github.workspace }}/android/awing-release-key.jks
          EOF
            echo "Release signing configured."
          fi

      - name: Install dependencies
        run: flutter pub get

      # Generate Android splash + app icons. Two SEPARATE packages:
      #   - flutter_native_splash:create  → res/drawable*/launch_background.xml
      #   - flutter_launcher_icons        → res/mipmap-*/ic_launcher.png
      # flutter_native_splash does NOT update the app icon — only the splash.
      - name: Generate Android splash + app icons
        run: |
          dart run flutter_native_splash:create
          dart run flutter_launcher_icons

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      # === SIGNED APK (only on main pushes, NOT tags) ===
      # On TAG pushes we skip the APK build to avoid two back-to-back
      # Gradle invocations in the same job — the second one runs out
      # of memory on the 7 GB ubuntu-latest runner because the first
      # one's Gradle daemon caches still consume heap. The APK is just
      # a sideloading convenience anyway; the Play Store only needs
      # the AAB built below.
      - name: Build APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: flutter build apk --release

      - name: Rename APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/awing-1.2.0.apk

      - name: Upload APK artifact
        # Non-fatal: artifact storage is a developer-convenience archive
        # (so we can download the APK from the run page for sideloading).
        # When the GitHub Actions artifact quota fills up, this step
        # fails and — without continue-on-error — would short-circuit
        # the AAB build + Play Console upload. Distribution must NOT
        # depend on the artifact archive succeeding.
        if: "!startsWith(github.ref, 'refs/tags/v')"
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: awing-android-apk
          path: build/app/outputs/flutter-apk/awing-1.2.0.apk
          # Session 66: was 30 days — dropped to 3 to keep GitHub free
          # storage tier (500 MB) from filling. APK goes to Play alpha
          # in the same job; 3 days covers any manual download need.
          retention-days: 3

      # Reset Gradle daemon between main-build APK and tag-build AAB.
      # On TAG pushes (when the APK build above was skipped) this is a
      # no-op, but harmless. On main pushes it stops any lingering
      # daemon process before the workflow finishes.
      - name: Stop Gradle daemon
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: cd android && ./gradlew --stop || true

      # === SIGNED APP BUNDLE for Play Store (only on tags) ===
      - name: Build signed App Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f android/key.properties ]; then
            echo "Skipping — no signing key configured"
            exit 0
          fi
          flutter build appbundle --release

      - name: Upload AAB artifact
        # Non-fatal — see comment on Upload APK artifact above. Play
        # Console upload (next step) must run even if the artifact
        # archive fails on quota.
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: awing-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          # Session 66: was 90 days — dropped to 3 to keep GitHub free
          # storage tier (500 MB) from filling. AAB goes to Play alpha
          # in the same job; 3 days covers any manual download need.
          retention-days: 3
          if-no-files-found: ignore

      # === AUTO-UPLOAD TO GOOGLE PLAY CLOSED TESTING - ALPHA ===
      # Pushes the signed AAB to the alpha (closed testing) track via the
      # Google Play Developer API. Alpha track opt-ins automatically
      # receive the new build for testing.
      #
      # IMPORTANT: this step ONLY publishes to alpha. Public production
      # release is gated by .github/workflows/release-gate.yml — that
      # cron job promotes alpha -> production once the tag is 72h+ old
      # AND no newer tag has superseded it. The 72h canary period lets
      # testers + Dr. Sama validate the build on real devices before
      # rolling to the world. Per spec 2026-06-25.
      #
      # Runs only on tags AND only when PLAY_SERVICE_ACCOUNT_JSON is set.
      # IMPORTANT: pinned to @v1.1.3 (not rolling @v1) because the rolling
      # tag pulled an older release that timed out on the 934 MB AAB with
      # "This edit has expired, please create a new Edit" — the underlying
      # Google Play API edit object expires before a slow upload completes.
      # @v1.1.3 uses chunked upload + retry, which handles large bundles
      # reliably. Failed run example: Actions run 26245053566 (2026-05-21).
      # Hard-fails on duplicate version codes or any other upload error.
      # Session 61 added a soft-fail (continue-on-error) wrapper here, but
      # the Version Code Ledger at the top of CLAUDE.md now prevents
      # duplicates before push, and the soft-fail was actively masking
      # real failures (Apple agreement, signing drift, etc.) as "green"
      # when nothing actually shipped. Removed in favor of fail-loud:
      # if this step fails, the workflow turns red and we see it
      # immediately. The AAB artifact is still archived above for manual
      # upload via Play Console if needed.
      - name: Upload to Play Closed Testing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.awing.learning
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed
