name: Release Gate (72h)

# Per-tag canary period. After CI uploads a build to TestFlight + Play
# alpha, public release waits 72h. If a newer tag arrives during the
# window, it supersedes the older tag (counter resets, the newer build
# becomes the candidate). After 72h with no successor, this workflow
# releases the candidate to the public.
#
# - Tester channels (TestFlight, Play alpha) get every build immediately
#   from build-android.yml / build-ios.yml.
# - This workflow ONLY promotes to App Store + Play production.
# - Cron: every 6 hours. Manual: workflow_dispatch with optional dry-run.
#
# Designed by Dr. Sama 2026-06-25 to give a real-user canary period
# without manual promotion clicks.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only — do not call any release/promote endpoint'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      skip_ios:
        description: 'Skip the App Store side'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      skip_android:
        description: 'Skip the Play side'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history for tag age + the full tag list.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          # release_gate.py only needs cryptography for JWT signing.
          pip install 'cryptography>=42.0.0'

      - name: Run release gate
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.skip_ios }}" = "true" ]; then
            ARGS="$ARGS --skip-ios"
          fi
          if [ "${{ github.event.inputs.skip_android }}" = "true" ]; then
            ARGS="$ARGS --skip-android"
          fi
          echo "Args: $ARGS"
          python scripts/release_gate.py $ARGS
