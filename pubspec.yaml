name: awing_ai_learning

description: A lightweight on-device AI application to teach the Awing language.

# Author: Dr. Guidion Sama, DIT

publish_to: "none"

version: 1.21.4+124
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  speech_to_text: ^7.0.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.3
  confetti: ^0.8.0
  flutter_native_splash: ^2.4.3
  share_plus: ^10.1.4
  file_picker: ^8.1.6
  record: ^6.1.1
  url_launcher: ^6.3.1
  # On-device pronunciation grader (Phase 1B smoke test → Phase 1C
  # Beginner mode "Grade my pronunciation" feature). Pure-Dart DTW
  # alignment over MFCC features, comparing the kid's recording to
  # the bundled native-speaker reference for that word. No native
  # dependencies — works on every Flutter target (Android arm64/
  # armv7/x86_64, iOS, desktop, web), fully offline, zero new app
  # size (re-uses the existing audio/native PAD pack). Replaces the
  # MMS-FA ONNX approach which couldn't run on x86_64 Android and
  # had a 605 MB model that was too big to bundle offline.
  # See lib/services/pronunciation_grader.dart + lib/utils/mfcc.dart
  # + lib/utils/dtw.dart.
  google_sign_in: ^6.2.2
  # Sign in with Apple — required by App Store Review Guideline 4.8 since the
  # app offers Google Sign-In. iOS-only at runtime; Android falls through to
  # the Google flow. ^6.1.0 supports Flutter 3.22+.
  sign_in_with_apple: ^6.1.4
  http: ^1.2.2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  # NOTE: Study Set teacher audio uploads (Phase 3) reuse the existing
  # Apps Script + Google Drive pipeline via ContributionService's
  # webhook — same base64-POST + Drive-download-URL pattern that
  # community pronunciation contributions have used since Session 61b.
  # No Firebase Storage / Blaze plan needed. See
  # lib/services/study_set_audio_service.dart and the
  # study_set_upload_audio / study_set_delete_audio /
  # study_set_delete_set_audio actions in scripts/contributions_webapp.gs.
  # Session 61 — V3+G10 security hardening.
  # Firebase App Check + Play Integrity API. The app proves to Firebase's
  # backend that requests come from an unmodified, Play-Store-installed copy
  # of THIS app, not a stolen API key being replayed from curl, a browser,
  # or a tampered/rooted device. Defends against:
  #   - V3: someone extracts the Firebase API key from the APK and uses it
  #         to read/write your Firestore from outside the app.
  #   - G10: someone repackages the app with auth checks stripped and tries
  #          to submit malformed contributions or scrape user data.
  # Requires manual Play Console + Firebase Console setup (see CLAUDE.md
  # Session 61 deployment checklist).
  firebase_app_check: ^0.3.1+7
  nsd: ^5.0.1
  network_info_plus: ^6.1.1
  # Phase C — On-device LLM via cactus (llama.cpp wrapper, iOS 12+ compatible).
  # Replaces flutter_gemma which required iOS 16 + crashed Windows Gradle.
  # Runs GGUF-format quantized models entirely on-device. Model = TinyLlama-
  # 1.1B-Chat Q4_K_M (~668 MB), hosted on CloudFlare R2, downloaded silently
  # in background after app install on WiFi (or with warning on mobile data).
  cactus: ^1.3.0
  # flutter_gemma stayed commented after Session 62 iOS 16 requirement fail.
  # flutter_gemma: ^1.2.2
  # Detects WiFi vs cellular so silent model download stays on WiFi
  # only. network_info_plus above only tells us IP/SSID; this tells us
  # the connection TYPE.
  connectivity_plus: ^6.1.0
  # v1.15.0 — Daily word suggestion notifier. Schedules a local notification
  # at the user-chosen time (default 8 AM) with 3 hand-picked words for the
  # day, scored by season, time-of-day and weekly category rotation. No
  # network calls; entirely on-device rule-based "AI".
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  permission_handler: ^12.0.1

dependency_overrides:
  # (record_linux override removed — record 6.x manages its own linux dep)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates platform-specific app icon sets from a single source PNG.
  # Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#006432"
  image: assets/splash_icon.png
  android: true
  ios: true

# Generates the actual app icon (separate from flutter_native_splash which
# only does the launch screen). Without this, the iOS app icon is the
# default Flutter placeholder — visible on the home screen and in the
# App Store listing. iOS requires icons WITHOUT alpha channel; the
# remove_alpha_ios flag strips it before bundling.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#006432"
  adaptive_icon_background: "#006432"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - config/webhooks.json
    - assets/images/app_icon.png
    # NACDA emblem -- shown in the About screen's "With Support From"
    # section above the NACDA chapter credits. Source: WhatsApp image
    # provided by Dr. Sama on 2026-06-11. Format: JPEG, ~13 KB.
    - assets/images/nacda_logo.jpg
    # Session 61c — list of bundled vocabulary image keys, used by
    # ImageService.hasImageSync() to filter game/quiz/exam vocab to
    # entries with a real illustration (no green placeholder fallback).
    # Regenerated by scripts/build_image_manifest.py before each
    # pad-assets tarball repack.
    - assets/image_manifest.json
    # Native audio inventory — lists which (audioKey, recorder) pairs
    # have a clip in audio/native/ vs audio/native_kids/<slug>/. Used by
    # the Dev Mode Record tab to show per-item per-recorder status badges
    # and power the "Missing native voice" filter in the Record tab. Without
    # this in the assets block, rootBundle.loadString() in
    # NativeAudioInventory.load() fails silently, the inventory stays
    # un-loaded, and EVERY caller of hasAnyRecording() returns false --
    # which is why recorded words (apo, agha, ...) were leaking back
    # into the Contribute pickers.
    - assets/native_audio_manifest.json
