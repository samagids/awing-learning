# Session 62: 4G heap is the middle ground.
#   • 3G was fine through v1.18.4+93, but flutter_gemma's MediaPipe compile
#     surface pushed the Kotlin daemon over the edge (Kotlin OOM at
#     record_android:compileReleaseKotlin).
#   • 6G was too much — on a typical 16 GB dev machine with Android Studio
#     + browsers + OneDrive + Defender already resident, requesting 6G for
#     one JVM forces OS paging. When Windows pages JVM native pages out
#     then can't page them back cleanly, the JVM crashes SIGSEGV
#     (that's what hs_err_pid<N>.log showed).
#   • 4G gives Kotlin enough room for MediaPipe classes without triggering
#     Windows paging.
# Plus: run Kotlin compile IN-PROCESS (not in a forked daemon) so a
# Kotlin OOM won't be a cascade failure — it'll surface as a normal OOM
# with a proper stack trace, not "daemon disappeared" mystery.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
android.useAndroidX=true
# Built-in Kotlin migration: attempted TWICE, reverted twice. Do not retry
# until the blocker below clears — it is not fixable from this repo.
#
# Attempt 1 (2026-07-05, v1.18.4+92, AGP 8.x): Flutter 3.44.2 did not
# support Built-in Kotlin in the release build path. CRITICAL LESSON —
# `flutter pub get` and `flutter analyze` PASS with builtInKotlin=true
# because neither invokes Gradle. Only assembleRelease tells the truth.
#
# Attempt 2 (2026-09-11, v1.23.2+138, AGP 9.0): fails harder, with a
# precise cause. android.builtInKotlin is PROJECT-WIDE, so it reaches
# every Flutter plugin module in the pub cache. Under AGP 9, applying
# `kotlin-android` is a hard error rather than a warning:
#
#   Build file '...pub.dev/android_id-0.4.1/android/build.gradle' line 25
#   > Failed to apply plugin 'kotlin-android'
#     The 'org.jetbrains.kotlin.android' plugin is no longer required
#     for Kotlin support since AGP 9.0.
#   https://issuetracker.google.com/438678642
#
# 16 third-party plugins still apply KGP in their own build files
# (android_id, audioplayers_android, device_info_plus, firebase_*,
# flutter_tts, network_info_plus, nsd_android, objectbox_flutter_libs,
# package_info_plus, record_android, share_plus, shared_preferences_android,
# sign_in_with_apple, speech_to_text). android_id is simply first
# alphabetically — fixing it just moves the error to the next one. These
# are files in the pub cache; we cannot edit them.
#
# THE BLOCKER IS THE PLUGIN ECOSYSTEM, NOT THIS REPO. The unblock is
# upstream releases that drop KGP, then a coordinated bump of all 16
# (several need breaking major upgrades). Track it as its own project,
# not a release-time task.
#
# DEADLINE: AGP 9 still honours the opt-out below, so we are fine today.
# AGP 10 removes it. That is the hard wall.
android.builtInKotlin=false
android.newDsl=false
