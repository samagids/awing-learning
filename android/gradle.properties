org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
android.useAndroidX=true
# KGP -> Built-in Kotlin migration (2026-07-05): enabling both flags
# means Flutter provides the Kotlin plugin, so our app no longer needs
# to declare kotlin-android in settings.gradle.kts or app/build.gradle.kts.
android.builtInKotlin=true
android.newDsl=true
