org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
android.useAndroidX=true
# KGP migration attempted 2026-07-05 and reverted: Flutter 3.44.2 does NOT
# actually support Built-in Kotlin in the release build path. flutter pub get
# and flutter analyze work with builtInKotlin=true (they don't invoke Gradle)
# but CI assembleRelease fails with "requires newer KGP" message. Defer this
# migration until a Flutter release actually supports Built-in Kotlin for AAB
# builds. Until then we keep the explicit KGP declaration and this flag off.
android.builtInKotlin=false
android.newDsl=false
