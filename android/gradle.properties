# Session 62: 4G heap is the middle ground.
#   • 3G was fine through v1.18.4+93, but flutter_gemma's MediaPipe compile
#     surface pushed the Kotlin daemon over the edge (Kotlin OOM at
#     record_android:compileReleaseKotlin).
#   • 6G was too much — on a typical 16 GB dev machine with Android Studio
#     + browsers + OneDrive + Defender already resident, requesting 6G for
#     one JVM forces OS paging. When Windows pages JVM native pages out
#     then can't page them back cleanly, the JVM crashes SIGSEGV
#     (that's what hs_err_pid<N>.log showed).
#   • 4G gives Kotlin enough room for MediaPipe classes without triggering
#     Windows paging.
# Plus: run Kotlin compile IN-PROCESS (not in a forked daemon) so a
# Kotlin OOM won't be a cascade failure — it'll surface as a normal OOM
# with a proper stack trace, not "daemon disappeared" mystery.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
android.useAndroidX=true
# KGP migration attempted 2026-07-05 and reverted: Flutter 3.44.2 does NOT
# actually support Built-in Kotlin in the release build path. flutter pub get
# and flutter analyze work with builtInKotlin=true (they don't invoke Gradle)
# but CI assembleRelease fails with "requires newer KGP" message. Defer this
# migration until a Flutter release actually supports Built-in Kotlin for AAB
# builds. Until then we keep the explicit KGP declaration and this flag off.
android.builtInKotlin=false
android.newDsl=false
